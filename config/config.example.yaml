exchange:
  testnet: true

ai:
  # LLM 只做真实亏损复盘，不参与实时开仓。
  model: "gpt-4.1-mini"

proxy:
  http: ""
  https: ""

external_apis:
  cryptopanic_token: ""
  coingecko_demo_key: ""

trading:
  execution_mode: "auto_testnet"   # auto_testnet=自动测试盘下单，advice_only=只生成规则交易卡
  entry_style: "market"
  timeframe: "5m"
  confirm_timeframe: "15m"
  loop_interval_minutes: 15
  ohlcv_limit: 120

risk:
  position_margin_pct: 10.0
  max_open_positions: 10
  daily_max_drawdown_pct: 20.0
  same_symbol_cooldown_minutes: 30
  max_leverage: 8
  min_confidence: 6
  min_balance_usdt: 8.0
  min_stop_loss_pct: 0.3
  max_stop_loss_pct: 12.0
  min_reward_r: 1.5

screener:
  mode: "short_squeeze_yaobi"
  min_volume_24h_usdt: 1000000
  max_contract_notional_usdt: 200.0
  scan_top_n: 40
  ai_top_n: 20
  min_yaobi_score: 55
  excluded_bases:
    - BTC
    - ETH
    - USDC
    - USDT
    - DAI
    - BUSD
    - FDUSD
