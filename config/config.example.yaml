exchange:
  testnet: true

ai:
  # LLM 负责测试盘开仓建议，并负责模拟盘失败/真实亏损复盘。
  model: "gpt-4.1-mini"

proxy:
  http: ""
  https: ""

external_apis:
  cryptopanic_token: ""
  coingecko_demo_key: ""

trading:
  execution_mode: "auto_testnet"   # auto_testnet=自动测试盘下单，advice_only=只生成交易卡
  entry_style: "market"
  timeframe: "5m"
  confirm_timeframe: "15m"
  loop_interval_minutes: 15
  ohlcv_limit: 120

risk:
  position_margin_pct: 10.0
  max_open_positions: 10
  daily_max_drawdown_pct: 20.0
  same_symbol_cooldown_minutes: 30
  max_leverage: 8
  min_confidence: 5
  min_balance_usdt: 8.0
  min_stop_loss_pct: 0.3
  max_stop_loss_pct: 12.0
  min_reward_r: 1.2

screener:
  mode: "short_squeeze_yaobi"
  # 测试盘采样模式：门槛适当降低，多收集交易样本，最终仍由 LLM 和风控二次拦截。
  min_volume_24h_usdt: 300000
  max_contract_notional_usdt: 200.0
  scan_top_n: 80
  ai_top_n: 30
  min_yaobi_score: 30
  excluded_bases:
    - BTC
    - ETH
    - USDC
    - USDT
    - DAI
    - BUSD
    - FDUSD
